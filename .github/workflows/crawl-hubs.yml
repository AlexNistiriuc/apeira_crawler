name: crawler hub
on:
  schedule:
    - cron: '0 4 * * *'        # una volta al giorno, 05:00 a Roma
  workflow_dispatch:
concurrency: { group: crawler-hub, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run hubs
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          RUN_MINUTES: 40
