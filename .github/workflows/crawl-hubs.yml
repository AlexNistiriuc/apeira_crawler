name: crawler hub
on:
  schedule:
    - cron: '30 * * * *'       # riserva: la catena qui sotto lo fa già ripartire da solo
  workflow_dispatch:
# Indipendente dal crawler startup: gira a catena per conto suo, così uno non blocca l'altro.
concurrency: { group: crawler-hub, cancel-in-progress: false }
permissions:
  contents: read
  actions: write   # solo per far ripartire il giro successivo
jobs:
  run:
    if: vars.SCOUTING_ATTIVO != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - id: hubs
        run: npm run hubs
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          RUN_MINUTES: 15
      # scoperta continua di pool nuovi: ricerche Brave (tetto dedicato) + link da eventi e programmi degli hub migliori
      - id: discovery
        if: always()
        run: npm run discovery
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          SCRAPEGRAPH_API_KEY: ${{ secrets.SCRAPEGRAPH_API_KEY }}
      # scoperta da registro (Norvegia sempre, Regno Unito con la chiave): società giovani con sito, in coda al crawler startup
      - id: registri
        if: always()
        run: npm run registri
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          SCRAPEGRAPH_API_KEY: ${{ secrets.SCRAPEGRAPH_API_KEY }}
          COMPANIES_HOUSE_KEY: ${{ secrets.COMPANIES_HOUSE_KEY }}
          KBO_USER: ${{ secrets.KBO_USER }}
          KBO_PASSWORD: ${{ secrets.KBO_PASSWORD }}
      # hub nuovi: il crawler startup parte subito a leggerli (se sta già girando, il giro resta in coda)
      - if: always() && (steps.hubs.outputs.hub_nuovi > 0 || steps.discovery.outputs.hub_nuovi > 0 || steps.registri.outputs.nuove > 0)
        run: for i in 1 2 3; do gh workflow run crawl-startups.yml --ref main && exit 0; sleep 20; done; exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # catena: riparte da solo. Se il giro non ha trovato hub nuovi aspetta 2 minuti. Tre tentativi di riavvio.
      - if: always() && steps.hubs.outcome == 'success'
        run: |
          if [ "${{ steps.discovery.outputs.hub_nuovi }}" = "0" ]; then sleep 120; fi
          for i in 1 2 3; do gh workflow run crawl-hubs.yml --ref main && exit 0; sleep 20; done; exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
