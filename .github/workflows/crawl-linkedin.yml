name: crawler LinkedIn
# Arricchisce le startup Alto/Medio con i dati LinkedIn via ScrapeGraph: dipendenti,
# anno di fondazione, data di inizio dei founder, età stimata dalla prima esperienza educativa.
# Gli evaluator usano la stessa black box (ensureLinkedin) durante la classificazione, quindi
# questo giro è una rete di sicurezza e un modo per lanciarlo a mano.
# Per fermarlo: Variables > SCRAPEGRAPH_ATTIVO = no (o SCOUTING_ATTIVO = no per tutto).
on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:
    inputs:
      limite: { description: 'quante startup al massimo in questo giro', default: '100' }
concurrency: { group: crawler-linkedin, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  run:
    if: vars.SCOUTING_ATTIVO != 'no' && vars.SCRAPEGRAPH_ATTIVO != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run linkedin -- ${{ inputs.limite || '100' }}
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          SCRAPEGRAPH_API_KEY: ${{ secrets.SCRAPEGRAPH_API_KEY }}
          SCRAPEGRAPH_MAX_FOUNDERS: '3'
          SCRAPEGRAPH_MAX_STARTUPS: '40'
          SCRAPEGRAPH_MAX_PER_RUN: '120'
          SCRAPEGRAPH_CACHE_DAYS: '30'
