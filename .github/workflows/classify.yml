name: classificatore euristico
on:
  # parte già alla fine di ogni giro del crawler startup; qui resta solo il lancio a mano
  workflow_dispatch:
    inputs:
      classificatore: { description: 'nome del file in src/classifiers', default: 'euristico' }
      limite: { description: 'quanti candidati al massimo', default: '3000' }
      con_fatti: { description: 'ripassa tutte le startup con fatti del crawler founder (1 = sì)', default: '0' }
      riallinea: { description: 'prima riallinea tutte le valutazioni al criterio severo (1 = sì)', default: '0' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - if: ${{ inputs.riallinea == '1' }}
        run: npm run realign
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
      - run: npm run classify -- ${{ inputs.classificatore || 'euristico' }} ${{ inputs.limite || '3000' }}
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          CON_FATTI: ${{ inputs.con_fatti || '0' }}
          REFRESH_VIEW: '1'
