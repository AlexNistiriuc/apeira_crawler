name: classificatore euristico
on:
  schedule:
    - cron: '0 7,17 * * *'     # 08:00 e 18:00 a Roma, prima delle valutazioni di Claude
  workflow_dispatch:
    inputs:
      classificatore: { description: 'nome del file in src/classifiers', default: 'euristico' }
      limite: { description: 'quanti candidati al massimo', default: '3000' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run classify -- ${{ inputs.classificatore || 'euristico' }} ${{ inputs.limite || '3000' }}
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
