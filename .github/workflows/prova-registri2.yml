name: prova registri 2
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Estonia, quante persone hanno la data di nascita
        run: |
          B=https://avaandmed.ariregister.rik.ee/sites/default/files/avaandmed
          curl -sSL -o p.zip "$B/ettevotja_rekvisiidid__kaardile_kantud_isikud.json.zip"
          unzip -p p.zip | head -c 300000000 > p.json || true
          echo "isiku_tyyp F (persona fisica):"; grep -c '"isiku_tyyp":"F"' p.json || true
          echo "synniaeg non null:"; grep -cE '"synniaeg":"[0-9]' p.json || true
          echo "campi con kood:"; grep -oE '"[a-z_]*kood[a-z_]*":' p.json | sort | uniq -c | sort -rn | head
          echo "esempio campo isikukood:"; grep -oE '"isikukood[a-z_]*":"?[^,]{0,14}' p.json | head -3 | sed -E 's/[0-9]{6}/******/'
