name: prova registri 2
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Belgio, form di login KBO open data
        run: |
          curl -sSL -c c.txt "https://kbopub.economie.fgov.be/kbo-open-data/login?lang=en" | grep -iE '<form|<input|action=' | sed -E 's/value="[^"]{20,}"/value="..."/g' | head -20
          echo "---files"
          curl -sSL -b c.txt "https://kbopub.economie.fgov.be/kbo-open-data/affiliation/xml/?files" -o f.html -w "%{http_code} %{url_effective}\n"; grep -oiE 'href="[^"]+"' f.html | head -15
