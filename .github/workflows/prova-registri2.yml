name: prova registri 2
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node tools/prova-registri2.js
        env:
          KBO_USER: ${{ secrets.KBO_USER }}
          KBO_PASSWORD: ${{ secrets.KBO_PASSWORD }}
