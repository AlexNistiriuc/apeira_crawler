name: classificatore Sage
# Valuta con Sage i candidati già passati dall'euristico, finché la coda non è vuota.
# Parte: alla fine di ogni giro del crawler startup, da sé stesso se resta lavoro, e ogni ora come riserva.
# Per fermare tutto lo scouting: Settings > Secrets and variables > Actions > Variables,
# variabile SCOUTING_ATTIVO = no (per ripartire: cancellala o mettila a si).
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      limite: { description: 'quanti candidati al massimo in questo giro', default: '300' }
concurrency: { group: classificatore-sage, cancel-in-progress: false }
permissions:
  contents: read
  actions: write   # solo per far ripartire il giro successivo
jobs:
  run:
    if: vars.SCOUTING_ATTIVO != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - id: sage
        run: npm run classify -- sage ${{ inputs.limite || '300' }}
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
          RUN_MINUTES: 40
          REFRESH_VIEW: '1'
      # stima età di CEO e CTO per le 100 migliori (solo quelle non ancora stimate: dopo il primo giro costa pochissimo)
      - if: steps.sage.outcome == 'success'
        run: npm run eta -- 100
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          SAGE_API_KEY: ${{ secrets.SAGE_API_KEY }}
      # catena: se in coda resta lavoro, riparte subito. Si ferma da sola con coda vuota o con un errore
      # (per esempio credito Sage finito), così non si sprecano né minuti né crediti.
      - if: steps.sage.outcome == 'success' && steps.sage.outputs.altro_lavoro == 'true'
        run: gh workflow run classify-sage.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
