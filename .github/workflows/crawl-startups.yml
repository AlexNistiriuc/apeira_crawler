name: crawler startup
on:
  schedule:
    - cron: '15 */3 * * *'     # ogni 3 ore
  workflow_dispatch:
concurrency: { group: crawler-startup, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run startups
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
          RUN_MINUTES: 50
