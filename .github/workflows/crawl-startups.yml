name: crawler startup
on:
  schedule:
    - cron: '15 * * * *'       # riserva: la catena qui sotto lo fa già ripartire senza sosta
    # per fermare tutto lo scouting: variabile del repo SCOUTING_ATTIVO = no
  workflow_dispatch:
concurrency: { group: crawler-startup, cancel-in-progress: false }
permissions:
  contents: read
  actions: write   # serve solo per far ripartire il giro successivo
jobs:
  run:
    if: vars.SCOUTING_ATTIVO != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 45 di lavoro + chiusura (scritture finali e statistiche); se scade, la catena si interrompe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - id: crawl
        run: npm run startups
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
          RUN_MINUTES: 45
      # subito dopo il crawler: l'euristico valuta i candidati nuovi, così Startup trovate è sempre aggiornato
      - run: npm run classify -- euristico 3000
        if: always()
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
      # fatti su età founder e fase (registri, Brave) PRIMA dei valutatori: così valutano una volta sola, con tutti i fatti
      - if: always() && steps.crawl.outcome == 'success'
        run: npm run founders -- 40
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          COMPANIES_HOUSE_KEY: ${{ secrets.COMPANIES_HOUSE_KEY }}
      # l'euristico ripassa solo le startup con fatti nuovi (il crawler founder ha aggiornato ultimo_check)
      - if: always() && steps.crawl.outcome == 'success'
        run: npm run classify -- euristico 3000
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
      # catena: appena finisce un giro riuscito ne parte un altro, così il crawler lavora senza sosta
      # (il cron orario resta come rete di sicurezza: GitHub a volte salta o ritarda gli orari programmati).
      # Si ferma da sola se il crawler fallisce, così un errore non brucia minuti in un ciclo veloce.
      # candidati nuovi: Sage li valuta (il crawler hub gira per conto suo e li usa per lo snowball)
      - if: always() && steps.crawl.outcome == 'success'
        run: |
          gh workflow run classify-sage.yml --ref main || echo "Sage disattivato: salto"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - if: always() && steps.crawl.outcome == 'success'
        run: gh workflow run crawl-startups.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
