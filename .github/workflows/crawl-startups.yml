name: crawler startup
on:
  schedule:
    - cron: '15 * * * *'       # ogni ora: con giri da ~50 minuti il crawler lavora praticamente senza sosta
    # attenzione: repo privato col piano gratuito = circa 2.000 minuti di Actions al mese, a questo ritmo durano circa 1,5 giorni
  workflow_dispatch:
concurrency: { group: crawler-startup, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run startups
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
          JINA_KEY: ${{ secrets.JINA_KEY }}
          RUN_MINUTES: 50
      # subito dopo il crawler: l'euristico valuta i candidati nuovi, così Startup trovate è sempre aggiornato
      - run: npm run classify -- euristico 3000
        if: always()
        env:
          SHEET_API_URL: ${{ secrets.SHEET_API_URL }}
          SHEET_API_TOKEN: ${{ secrets.SHEET_API_TOKEN }}
